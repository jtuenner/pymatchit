name: Tests

on: [push, pull_request]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check formatting with black
      uses: psf/black@stable

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        pandas: [""]
        include:
          # Oldest supported pandas (pyproject.toml requires pandas>=1.3);
          # numpy<2 because pandas 1.3 wheels predate numpy 2.0
          - python-version: "3.9"
            pandas: '"pandas==1.3.*" "numpy<2"'
          # Most recent pandas release
          - python-version: "3.13"
            pandas: "--upgrade pandas"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev] ${{ matrix.pandas }}
    - name: Run tests
      run: |
        pytest
